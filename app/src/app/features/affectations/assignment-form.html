<div class="mx-auto max-w-2xl space-y-5">
  <div>
    <a routerLink="/affectations" class="text-sm text-blue-600 hover:underline">
      ← Retour à la liste
    </a>
    <h1 class="mt-2 text-xl font-bold text-slate-900">
      {{ isEdit() ? "Modifier l'affectation" : 'Nouvelle affectation' }}
    </h1>
  </div>

  <form class="card space-y-4" (ngSubmit)="submit()">
    <div>
      <label class="label" for="a-vehicle">Véhicule</label>
      <select
        id="a-vehicle"
        class="input"
        name="vehiculeId"
        [ngModel]="form().vehiculeId"
        (ngModelChange)="update('vehiculeId', $event)"
        required
      >
        <option value="">— Sélectionner un véhicule disponible —</option>
        @for (vehicle of availableVehicles; track vehicle.id) {
          <option [value]="vehicle.id">
            {{ vehicle.immatriculation }} — {{ vehicle.marque }} {{ vehicle.modele }}
          </option>
        }
      </select>
      @if (availableVehicles.length === 0) {
        <p class="mt-1 text-xs text-amber-600">
          Aucun véhicule disponible pour le moment.
        </p>
      }
    </div>

    <div>
      <label class="label" for="a-driver">Conducteur</label>
      <select
        id="a-driver"
        class="input"
        name="conducteurId"
        [ngModel]="form().conducteurId"
        (ngModelChange)="update('conducteurId', $event)"
        required
      >
        <option value="">— Sélectionner un conducteur —</option>
        @for (driver of drivers; track driver.id) {
          <option [value]="driver.id">
            {{ driver.prenom }} {{ driver.nom }} ({{ driver.email }})
          </option>
        }
      </select>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="label" for="a-start">Date de début</label>
        <input
          id="a-start"
          type="date"
          class="input"
          name="dateDebut"
          [ngModel]="form().dateDebut"
          (ngModelChange)="update('dateDebut', $event)"
          required
        />
      </div>
      <div>
        <label class="label" for="a-end">Date de fin</label>
        <input
          id="a-end"
          type="date"
          class="input"
          name="dateFin"
          [ngModel]="form().dateFin"
          (ngModelChange)="update('dateFin', $event)"
          required
        />
      </div>
    </div>

    <div>
      <label class="label" for="a-motif">Motif</label>
      <textarea
        id="a-motif"
        class="input"
        name="motif"
        rows="3"
        placeholder="Livraisons zone nord, mission client…"
        [ngModel]="form().motif"
        (ngModelChange)="update('motif', $event)"
        required
      ></textarea>
    </div>

    @if (error()) {
      <p class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
        {{ error() }}
      </p>
    }

    <div class="flex justify-end gap-3">
      <a routerLink="/affectations" class="btn-secondary">Annuler</a>
      <button type="submit" class="btn-primary">
        {{ isEdit() ? 'Enregistrer' : "Créer l'affectation" }}
      </button>
    </div>
  </form>
</div>
