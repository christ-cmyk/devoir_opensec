<div class="mx-auto max-w-2xl space-y-5">
  <div>
    <a routerLink="/entretiens" class="text-sm text-blue-600 hover:underline">
      ← Retour à la liste
    </a>
    <h1 class="mt-2 text-xl font-bold text-slate-900">
      {{ isEdit() ? "Modifier l'entretien" : 'Planifier un entretien' }}
    </h1>
  </div>

  <form class="card space-y-4" (ngSubmit)="submit()">
    <div>
      <label class="label" for="m-vehicle">Véhicule</label>
      <select
        id="m-vehicle"
        class="input"
        name="vehiculeId"
        [ngModel]="form().vehiculeId"
        (ngModelChange)="update('vehiculeId', $event)"
        required
      >
        <option value="">— Sélectionner un véhicule —</option>
        @for (vehicle of vehicles; track vehicle.id) {
          <option [value]="vehicle.id">
            {{ vehicle.immatriculation }} — {{ vehicle.marque }} {{ vehicle.modele }}
          </option>
        }
      </select>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="label" for="m-type">Type</label>
        <select
          id="m-type"
          class="input"
          name="type"
          [ngModel]="form().type"
          (ngModelChange)="update('type', $event)"
        >
          @for (type of types; track type) {
            <option [value]="type">{{ typeLabels[type] }}</option>
          }
        </select>
      </div>
      <div>
        <label class="label" for="m-date">Date prévue</label>
        <input
          id="m-date"
          type="date"
          class="input"
          name="datePrevue"
          [ngModel]="form().datePrevue"
          (ngModelChange)="update('datePrevue', $event)"
          required
        />
      </div>
    </div>

    <div>
      <label class="label" for="m-description">Description</label>
      <textarea
        id="m-description"
        class="input"
        name="description"
        rows="3"
        placeholder="Vidange, remplacement des plaquettes…"
        [ngModel]="form().description"
        (ngModelChange)="update('description', $event)"
        required
      ></textarea>
    </div>

    <div>
      <label class="label" for="m-cost">Coût estimé (€)</label>
      <input
        id="m-cost"
        type="number"
        class="input"
        name="coutEstime"
        min="0"
        step="0.01"
        [ngModel]="form().coutEstime"
        (ngModelChange)="update('coutEstime', $event)"
        required
      />
    </div>

    @if (isEdit()) {
      <div>
        <label class="label" for="m-status">Statut</label>
        <select
          id="m-status"
          class="input"
          name="statut"
          [ngModel]="form().statut"
          (ngModelChange)="update('statut', $event)"
        >
          @for (status of ['PLANIFIE', 'EN_COURS', 'TERMINE', 'ANNULE']; track status) {
            <option [value]="status">{{ statusLabels[status] }}</option>
          }
        </select>
      </div>
    }

    @if (error()) {
      <p class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
        {{ error() }}
      </p>
    }

    <div class="flex justify-end gap-3">
      <a routerLink="/entretiens" class="btn-secondary">Annuler</a>
      <button type="submit" class="btn-primary">
        {{ isEdit() ? 'Enregistrer' : 'Planifier' }}
      </button>
    </div>
  </form>
</div>
