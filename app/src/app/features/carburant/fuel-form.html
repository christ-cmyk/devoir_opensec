<div class="mx-auto max-w-2xl space-y-5">
  <div>
    <a routerLink="/carburant" class="text-sm text-blue-600 hover:underline">
      ← Retour à la liste
    </a>
    <h1 class="mt-2 text-xl font-bold text-slate-900">
      {{ isEdit() ? 'Modifier le plein' : 'Saisir un plein' }}
    </h1>
  </div>

  <form class="card space-y-4" (ngSubmit)="submit()">
    <div>
      <label class="label" for="f-vehicle">Véhicule</label>
      <select
        id="f-vehicle"
        class="input"
        name="vehiculeId"
        [ngModel]="form().vehiculeId"
        (ngModelChange)="update('vehiculeId', $event)"
        required
      >
        <option value="">— Sélectionner un véhicule —</option>
        @for (vehicle of vehicles; track vehicle.id) {
          <option [value]="vehicle.id">
            {{ vehicle.immatriculation }} — {{ vehicle.marque }} {{ vehicle.modele }}
          </option>
        }
      </select>
    </div>

    @if (!isConducteur) {
      <div>
        <label class="label" for="f-driver">Conducteur</label>
        <select
          id="f-driver"
          class="input"
          name="conducteurId"
          [ngModel]="form().conducteurId"
          (ngModelChange)="update('conducteurId', $event)"
          required
        >
          <option value="">— Sélectionner un conducteur —</option>
          @for (driver of drivers; track driver.id) {
            <option [value]="driver.id">
              {{ driver.prenom }} {{ driver.nom }}
            </option>
          }
        </select>
      </div>
    }

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <label class="label" for="f-date">Date</label>
        <input
          id="f-date"
          type="date"
          class="input"
          name="date"
          [ngModel]="form().date"
          (ngModelChange)="update('date', $event)"
          required
        />
      </div>
      <div>
        <label class="label" for="f-station">Station</label>
        <input
          id="f-station"
          type="text"
          class="input"
          name="station"
          placeholder="Total Energies A1"
          [ngModel]="form().station"
          (ngModelChange)="update('station', $event)"
          required
        />
      </div>
      <div>
        <label class="label" for="f-litres">Litres</label>
        <input
          id="f-litres"
          type="number"
          class="input"
          name="litres"
          min="0"
          step="0.01"
          [ngModel]="form().litres"
          (ngModelChange)="update('litres', $event)"
          required
        />
      </div>
      <div>
        <label class="label" for="f-price">Prix total (€)</label>
        <input
          id="f-price"
          type="number"
          class="input"
          name="prixTotal"
          min="0"
          step="0.01"
          [ngModel]="form().prixTotal"
          (ngModelChange)="update('prixTotal', $event)"
          required
        />
      </div>
    </div>

    <div>
      <label class="label" for="f-km">Kilométrage au plein</label>
      <input
        id="f-km"
        type="number"
        class="input"
        name="kilometrageAuPlein"
        min="0"
        step="1"
        [ngModel]="form().kilometrageAuPlein"
        (ngModelChange)="update('kilometrageAuPlein', $event)"
        required
      />
      @if (form().vehiculeId && form().kilometrageAuPlein > 0) {
        <p class="mt-1 text-xs text-slate-500">
          Consommation calculée après enregistrement (2 pleins minimum).
        </p>
      }
    </div>

    @if (error()) {
      <p class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
        {{ error() }}
      </p>
    }

    <div class="flex justify-end gap-3">
      <a routerLink="/carburant" class="btn-secondary">Annuler</a>
      <button type="submit" class="btn-primary">
        {{ isEdit() ? 'Enregistrer' : 'Enregistrer le plein' }}
      </button>
    </div>
  </form>
</div>
