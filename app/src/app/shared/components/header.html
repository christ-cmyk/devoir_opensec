<header
  class="sticky top-0 z-30 flex items-center justify-between gap-4 border-b border-slate-200 bg-white px-4 py-3 md:px-6"
>
  <div class="md:hidden">
    <a routerLink="/dashboard" class="text-base font-bold text-slate-900">
      🚗 Parc Auto
    </a>
  </div>

  <div class="hidden text-sm font-medium text-slate-500 md:block">
    Gestion de parc automobile
  </div>

  @if (auth.currentUser(); as user) {
    <div class="flex items-center gap-3">
      <div class="text-right">
        <p class="text-sm font-semibold text-slate-900">
          {{ user.prenom }} {{ user.nom }}
        </p>
        <p class="text-xs text-slate-500">{{ roleLabel[user.role] }}</p>
      </div>
      <div
        class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-600 text-sm font-bold text-white"
        aria-hidden="true"
      >
        {{ user.prenom.charAt(0) }}{{ user.nom.charAt(0) }}
      </div>
      <button type="button" class="btn-secondary" (click)="logout()">
        Déconnexion
      </button>
    </div>
  }
</header>
